name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Determine version
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $ver = "${{ inputs.version }}"
          }
          if (-not $ver) { $ver = "1.0.0" }
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Package portable zip and Setup.exe
        shell: pwsh
        run: |
          python -c "from scripts.packager import build_release_packages; build_release_packages('${{ steps.meta.outputs.version }}')"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FileHelper-Windows
          path: |
            dist/FileHelper-win64-portable.zip
            dist/FileHelper-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/FileHelper-win64-portable.zip
            dist/FileHelper-Setup.exe
