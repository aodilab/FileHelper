  <title>文件传输助手</title>
  <style>

    .bubble:active, .file:active, .pic:active { opacity: 0.84; } .pic { display: block; border-radius: 5px; background: #DADADA; object-fit: cover; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.06); -webkit-touch-callout: default; user-select: auto; -webkit-user-select: auto; }

    .dl-card { width: 100%; max-width: 320px; background: #fff; border-radius: 14px; padding: 20px; text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,0.16); } .dl-title { font-size: 16px; font-weight: 600; color: var(--ink); word-break: break-all; line-height: 1.4; } .dl-sub { margin-top: 6px; font-size: 13px; color: var(--sub); line-height: 1.45; }

  </style>
</head>
<body>
  <div id="pwa-safepill"></div>
  <div class="app" id="app">
    <div class="top-bar"><span class="top-title">文件传输助手</span><button class="btn-clear" id="btnClear" type="button">清空</button></div>
    <main class="chat-list" id="chatList"></main>
    <footer class="composer" id="composer">

      <label class="btn-plus" id="btnPlus" aria-label="添加"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><input type="file" id="inFile" multiple></label>
      <button class="btn-send" id="btnSend" type="button">发送</button>
    </footer>
  </div>
  <div class="ctx" id="ctxMenu"><div class="ctx-arr" id="ctxArr"></div><div id="ctxBtns" style="display:flex"></div></div>
  <div class="viewer" id="viewer"><img id="viewerImg" alt=""><video id="viewerVid" controls playsinline style="display:none"></video><div class="viewer-bar"><span id="viewerHint" style="color:rgba(255,255,255,0.75);font-size:13px">长按图片可存相册</span><div class="viewer-acts"><button id="viewerEdit" type="button">编辑</button><button id="viewerSave" type="button">保存</button><button id="viewerDel" type="button">删除</button><button id="viewerClose" type="button">关闭</button></div></div></div>
  <div class="editor" id="editor" style="z-index:180"><div class="ed-top"><button id="edCancel" type="button">取消</button><button id="edUndo" type="button">撤销</button></div><canvas id="edCv"></canvas><div class="ed-bot"><div class="ed-tools" id="edTools"><button type="button" data-t="pen" class="on">画笔</button><button type="button" data-t="rect">方框</button><button type="button" data-t="mosaic">马赛克</button><button type="button" data-t="crop">裁剪</button><button type="button" id="edRot">旋转</button></div><button class="btn-go" id="edDone" type="button">完成</button></div></div>
  <div class="dl-modal" id="dlModal"><div class="dl-card"><div class="dl-title" id="dlTitle"></div><div class="dl-sub" id="dlSub"></div><div class="dl-acts"><a class="btn-go" id="dlGo" href="#" style="display:none"></a><button class="btn-go" id="dlCopy" type="button">复制下载链接</button><button class="dl-btn-txt" id="dlClose" type="button">关闭</button></div></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const $ = (id) => document.getElementById(id), el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };

    const isStandalone = Boolean(window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
    const isVideo = (it) => VIDEO_RE.test(it.name || '') || (it.mime || '').startsWith('video/'), isImg = (it) => Boolean(it.ratio);
    let rendered = new Map(), itemsMap = new Map(), lastTs = null, curView = null, toastTimer = null, stick = true, pageVer = null, busy = false, lpTimer = null, lpFired = false, altOrigin = null, altProbed = false;
    const dlParam = new URLSearchParams(location.search).get('dl');

    const chipText = (ts) => { const d = new Date(ts * 1000), hm = d.toTimeString().slice(0, 5); return d.toDateString() === new Date().toDateString() ? hm : `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`; };
    const fileSub = (it, m) => { const s = it.status || ''; return s.includes('传输') ? `${it.size_str} · ${s}` : s === '已完成' ? `${it.size_str} · ${m ? '已发送' : '已接收'}` : (m ? it.size_str : `${it.size_str} · ${isVideo(it) ? '轻点播放 / 存相册' : '轻点下载到本地'}`); };
    const toBottom = () => { list.scrollTop = list.scrollHeight; }, hideCtx = () => { $('ctxMenu').classList.remove('open', 'below'); lpFired = false; };

    let fullH = window.innerHeight, kbH = +localStorage.getItem('fh_kbh') || Math.round(fullH * 0.48), kbActive = false, touchY = 0, focusTimer = null;
    const EASE = { duration: 240, easing: 'cubic-bezier(0.32,0.72,0,1)' };
    function fit() {

      if (kbOpen) { kbH = rawH; localStorage.setItem('fh_kbh', kbH); } else if (!kbActive) fullH = rawH;
      app.style.height = (kbActive || kbOpen ? kbH : fullH) + 'px'; app.classList.toggle('kb', kbActive || kbOpen); if (stick && atBot) toBottom();

    function openKb() {
      hideCtx(); if (kbActive) return;
      kbActive = true; stick = true; const prevH = app.offsetHeight; textInput.classList.add('focusing'); void textInput.offsetHeight; textInput.focus();
      app.classList.add('kb'); app.style.height = kbH + 'px'; toBottom();
      if (prevH - kbH > 40 && app.animate) app.animate([{ height: prevH + 'px' }, { height: kbH + 'px' }], EASE);

    }
    if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', () => window.scrollTo(0, 0)); }
    window.addEventListener('resize', fit); list.addEventListener('scroll', () => { hideCtx(); stick = list.scrollHeight - list.scrollTop - list.clientHeight < 60; }, { passive: true });
    $('kbShield').addEventListener('touchend', (e) => { e.preventDefault(); openKb(); }); $('kbShield').addEventListener('click', openKb); textInput.addEventListener('focus', openKb);
    textInput.addEventListener('blur', () => { kbActive = false; clearTimeout(focusTimer); textInput.classList.remove('focusing'); const prevH = app.offsetHeight; window.scrollTo(0, 0); fit(); const nextH = app.offsetHeight; if (nextH - prevH > 40 && app.animate) app.animate([{ height: prevH + 'px' }, { height: nextH + 'px' }], EASE); });
    $('btnPlus').addEventListener('click', (e) => { hideCtx(); if (kbActive || document.activeElement === textInput) { e.preventDefault(); textInput.blur(); } });

    list.addEventListener('touchmove', (e) => { if (Math.abs(e.touches[0].clientY - touchY) > 8) { clearTimeout(lpTimer); if (document.activeElement === textInput) textInput.blur(); } }, { passive: true });
    list.addEventListener('click', (e) => { if (lpFired) { lpFired = false; return; } hideCtx(); if (!e.target.closest('.bubble,.pic,.file')) textInput.blur(); });
    document.addEventListener('click', (e) => { if (!e.target.closest('#ctxMenu')) hideCtx(); });
    document.addEventListener('touchmove', (e) => { if (!e.target.closest('.chat-list,.input-box,.viewer,#edCv')) e.preventDefault(); }, { passive: false });

    function closeViewer() { $('viewer').classList.remove('open'); const v = $('viewerVid'); v.pause(); v.removeAttribute('src'); v.load(); curView = null; }
    function openViewer(it) {
      curView = it; const vid = isVideo(it), imgEl = $('viewerImg'), vidEl = $('viewerVid');
      imgEl.style.display = vid ? 'none' : ''; vidEl.style.display = vid ? '' : 'none';
      $('viewerEdit').style.display = vid ? 'none' : '';
      $('viewerSave').style.display = (!vid && isIOS && !window.isSecureContext) ? 'none' : '';
      $('viewerSave').textContent = vid ? '存相册' : '保存';
      $('viewerHint').textContent = vid ? '视频预览' : '长按图片可存相册';
      if (vid) { imgEl.removeAttribute('src'); vidEl.src = `${it.url}?inline=1&t=${it.ts || 0}`; }
      else { vidEl.pause(); vidEl.removeAttribute('src'); imgEl.src = `${it.url}?inline=1&t=${it.ts || 0}`; }
      $('viewer').classList.add('open');
    }
    const delItem = async (id) => { await fetch('/api/delete', { method: 'POST', body: JSON.stringify({ id }) }); syncQueue(); };
    const triggerDl = (it, href) => { const a = el('a'); a.href = href || it.url; a.download = it.name || 'file'; document.body.appendChild(a); a.click(); a.remove(); };
    function openDlSheet(it, inSvc) {
      const vid = isVideo(it), go = $('dlGo'), setGo = (t, off) => { go.textContent = t; go.style.pointerEvents = off ? 'none' : ''; go.style.opacity = off ? '0.6' : ''; };
      $('dlTitle').textContent = it.name; $('dlCopy').className = 'dl-btn-sub'; $('dlCopy').onclick = () => copyText(location.origin + it.url, '已复制下载链接');
      $('dlClose').style.display = inSvc ? 'none' : 'flex'; $('dlClose').onclick = () => $('dlModal').classList.remove('open');
      go.style.display = 'flex'; go.className = 'btn-go'; go.href = it.url; go.download = it.name || 'file'; if (inSvc) { go.removeAttribute('target'); } else { go.target = '_blank'; go.rel = 'noopener'; }
      setGo(vid ? '跳转到系统保存（点更多…）' : '立即下载', false); $('dlSub').textContent = `${it.size_str} · 点下方打开后选「更多… → ${vid ? '存储视频' : '存储到“文件”'}」`;
      if (inSvc && (it.size || 0) <= 262144000) { setGo('正在准备文件 0%', true); const x = new XMLHttpRequest(); x.open('GET', it.url); x.responseType = 'blob'; x.onprogress = (e) => e.lengthComputable && setGo(`正在准备文件 ${Math.round(e.loaded / e.total * 100)}%`, true); x.onload = () => x.status === 200 ? (go.href = URL.createObjectURL(x.response), setGo(vid ? '打开「更多…」存相册' : '点击保存文件', false)) : setGo('直接下载', false); x.onerror = () => setGo('直接下载', false); x.send(); }
      $('dlModal').classList.add('open');

    async function saveMedia(it, toAlbum = true) {

        try { if (vid) showToast('正在准备视频...', true); const b = await (await fetch(it.url)).blob(), f = new File([b], it.name || (vid ? 'video.mp4' : 'image.png'), { type: b.type || (vid ? 'video/mp4' : 'image/png') }); if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return showToast(''); } } catch (e) { if (e && e.name === 'AbortError') return showToast(''); }

    }
    function popCtx(target, it, pt) {
      const box = $('ctxBtns'); box.innerHTML = ''; lpFired = true;
      const add = (lbl, fn) => { const b = el('button', '', lbl); b.type = 'button'; b.onclick = (e) => { e.stopPropagation(); hideCtx(); fn(); }; box.appendChild(b); };

    async function syncQueue() {

    textInput.addEventListener('input', autoGrow); textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendText(); } });
    $('btnSend').addEventListener('mousedown', (e) => e.preventDefault()); $('btnSend').onclick = sendText;

      busy = false; showToast(ok === files.length ? '已发送' : `有 ${files.length - ok} 个失败`);
    };

    const cv = $('edCv'), ctx = cv.getContext('2d');
    let edTool = 'pen', edHist = [], edTarget = null, edPts = [], edCrop = null, edCropSnap = null, edDrag = false, edSnap = null;
    function openEditor(src, target) {

      const img = new Image(); img.onload = () => { const sc = Math.min(1, 2048 / Math.max(1, img.naturalWidth, img.naturalHeight)); cv.width = Math.max(1, Math.round(img.naturalWidth * sc)); cv.height = Math.max(1, Math.round(img.naturalHeight * sc)); ctx.drawImage(img, 0, 0, cv.width, cv.height); $('editor').classList.add('open'); }; img.src = src;
    }
